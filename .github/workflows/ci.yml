name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (foundry)
    runs-on: ubuntu-latest
    env:
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Build
        run: forge build --sizes
      - name: Lint
        run: forge lint
      - name: Format check
        run: forge fmt --check
      - name: Test (unit)
        run: forge test -vvv --no-match-path 'test/fork/**'
        env:
          FOUNDRY_PROFILE: ci
      - name: Test (fork — Sepolia)
        if: ${{ env.SEPOLIA_RPC_URL != '' }}
        run: forge test -vv --match-path 'test/fork/**'
        env:
          FORK_TESTS: 1

  packages:
    name: packages (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
